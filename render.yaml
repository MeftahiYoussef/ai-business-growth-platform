services:
  - type: web
    name: ai-business-growth-backend-staging
    runtime: python
    rootDir: django-backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: sh bin/render_free_staging_start.sh
    healthCheckPath: /api/health/ready/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: USE_SQLITE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CONN_MAX_AGE
        value: "60"
      - key: DATABASE_SSLMODE
        value: require
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: CELERY_WORKER_CONCURRENCY
        value: "1"
      - key: START_CELERY_IN_WEB
        value: "true"
      - key: AI_ASYNC_CONTENT_PLAN_ENABLED
        value: "true"
      - key: ASYNC_REPORTS_ENABLED
        value: "true"
      - key: REPORT_AI_RECOMMENDATIONS_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_DEFAULT_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_SECONDS
        value: "60"
      - key: GROQ_MAX_RETRIES
        value: "2"
      - key: GROQ_MAX_OUTPUT_TOKENS
        value: "4000"
      - key: AI_MAX_USER_DAILY_REQUESTS
        value: "20"
      - key: AI_MAX_BUSINESS_MONTHLY_REQUESTS
        value: "500"
      - key: AI_MAX_REQUEST_INPUT_LENGTH
        value: "4000"
      - key: AI_MAX_ADDITIONAL_INSTRUCTIONS_LENGTH
        value: "1200"
      - key: CONTENT_IDEAS_MAX_BUSINESS_DAILY_ITEMS
        value: "200"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURE_HSTS_PRELOAD
        value: "true"
      - key: USE_X_FORWARDED_PROTO
        value: "true"
      - key: DJANGO_LOG_LEVEL
        value: INFO
