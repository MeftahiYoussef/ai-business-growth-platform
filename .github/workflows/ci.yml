name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      USE_SQLITE: "false"
      DATABASE_NAME: business_intelligence_ci
      DATABASE_USER: business_intelligence
      DATABASE_PASSWORD: ci-postgres-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_CONN_MAX_AGE: "0"
      DATABASE_SSLMODE: disable
      DJANGO_SECRET_KEY: ci-placeholder-secret-key
      AI_PROVIDER: groq
      GROQ_API_KEY: ci-placeholder-groq-key
      GROQ_DEFAULT_MODEL: openai/gpt-oss-20b
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: business_intelligence_ci
          POSTGRES_USER: business_intelligence
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_intelligence -d business_intelligence_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r django-backend/requirements.txt
      - run: python manage.py check
        working-directory: django-backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: django-backend
      - run: python manage.py migrate
        working-directory: django-backend
      - run: python manage.py test
        working-directory: django-backend
      - run: pytest
        working-directory: django-backend
      - run: ruff check .
        working-directory: django-backend
      - run: mypy .
        working-directory: django-backend
      - name: Secret scan
        run: |
          groq_prefix="gs""k_"
          ! grep -RIn --exclude-dir=.git --exclude=.env --exclude='*.sqlite3' "$groq_prefix" .
          ! grep -RIn --exclude-dir=node_modules --exclude-dir=.next "NEXT_PUBLIC_GROQ_API_KEY" frontend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
