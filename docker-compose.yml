services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-business_intelligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-postgres-password}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    profiles: ["migration"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  django-backend:
    build: ./django-backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./django-backend/.env.example
    environment:
      USE_SQLITE: "false"
      DATABASE_NAME: ${POSTGRES_DB:-business_intelligence}
      DATABASE_USER: ${POSTGRES_USER:-business_intelligence}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-postgres-password}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_CONN_MAX_AGE: "60"
      DATABASE_SSLMODE: prefer
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://django-backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - django-backend

volumes:
  postgres_data:
  mongo_data:
